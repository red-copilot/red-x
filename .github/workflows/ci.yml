name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
          if-no-files-found: error

  go:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test ./...
      - run: CGO_ENABLED=1 go test -race ./...

  image:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t arl:ci .
      - run: |
          docker run --rm --entrypoint sh arl:ci -c '
            for t in subfinder dnsx naabu tlsx httpx katana nuclei nmap massdns python python3 celery flask phantomjs wih; do
              if command -v "$t" >/dev/null 2>&1; then echo "forbidden executable: $t"; exit 1; fi
            done
          '
