name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
          if-no-files-found: error

  go:
    needs: web
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ARL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test ./...
      - run: CGO_ENABLED=1 go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -o arl ./cmd/arl
      - run: docker compose -f deploy/compose.yaml config >/dev/null
