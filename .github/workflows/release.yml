name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ARL_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - name: Build web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Verify and test Go code
        run: |
          go mod verify
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          CGO_ENABLED=0 go test ./...
      - name: Build release binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            name="arl_${TAG}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then name="${name}.exe"; fi
            echo "Building $name"
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/$name" ./cmd/arl
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
