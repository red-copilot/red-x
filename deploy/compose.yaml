name: arl

services:
  postgres:
    image: postgres:18-alpine
    container_name: arl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arl
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-arlpassword}"
      POSTGRES_DB: arl
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arl -d arl"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [arl]

  redis:
    image: redis:7.4-alpine
    container_name: arl-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-arlpassword}"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:-arlpassword}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [arl]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: "3.0.0"
    image: arl:local
    container_name: arl-web
    restart: unless-stopped
    command: ["web", "--config", "/etc/arl/config.yaml"]
    environment:
      ARL_POSTGRES_DSN: "host=postgres port=5432 user=arl password=${POSTGRES_PASSWORD:-arlpassword} dbname=arl sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5003:5003"
    volumes:
      - ./config.docker.yaml:/etc/arl/config.yaml:ro
      - arl-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/arl", "health", "--url", "http://127.0.0.1:5003/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [arl]

  worker:
    image: arl:local
    container_name: arl-worker
    restart: unless-stopped
    command: ["worker", "--config", "/etc/arl/config.yaml"]
    environment:
      ARL_POSTGRES_DSN: "host=postgres port=5432 user=arl password=${POSTGRES_PASSWORD:-arlpassword} dbname=arl sslmode=disable"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./config.docker.yaml:/etc/arl/config.yaml:ro
      - arl-data:/data
    cap_add: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    networks: [arl]

  scheduler:
    image: arl:local
    container_name: arl-scheduler
    restart: unless-stopped
    command: ["scheduler", "--config", "/etc/arl/config.yaml"]
    environment:
      ARL_POSTGRES_DSN: "host=postgres port=5432 user=arl password=${POSTGRES_PASSWORD:-arlpassword} dbname=arl sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./config.docker.yaml:/etc/arl/config.yaml:ro
      - arl-data:/data
    security_opt: ["no-new-privileges:true"]
    networks: [arl]

volumes:
  postgres-data:
  redis-data:
  arl-data:

networks:
  arl:
    driver: bridge
