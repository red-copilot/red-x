name: arl

# Infrastructure only. Run the ARL binary natively via systemd; the console is
# embedded in the binary. Ports bind to loopback for the host-native process.
services:
  postgres:
    image: postgres:18-alpine
    container_name: arl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arl
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-arlpassword}"
      POSTGRES_DB: arl
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arl -d arl"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [arl]

  redis:
    image: redis:7.4-alpine
    container_name: arl-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-arlpassword}"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD:-arlpassword}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [arl]

volumes:
  postgres-data:
  redis-data:

networks:
  arl:
    driver: bridge
