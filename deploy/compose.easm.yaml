name: arl

services:
  neo4j:
    image: neo4j:5.26.32-community-trixie@sha256:0a6e7aedf54a531f76286032d4365ead65b11cca05e4a15cdf23b8e53d6db02b
    container_name: arl-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in deploy/.env.easm}
      # Neo4j treats every NEO4J_* variable as a server setting; use an ARL_* alias for the healthcheck.
      ARL_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in deploy/.env.easm}
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${ARL_NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    networks: [arl]

  icp-query:
    image: yiminger/ymicp:v0.7.6@sha256:ba635d20d9c3421b93b0be1549624363e02a154bbe240011c01c0c16782779fe
    container_name: arl-icp-query
    restart: unless-stopped
    ports:
      - "127.0.0.1:16181:16181"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1',16181),2).close()\""]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [arl]

volumes:
  neo4j-data:
